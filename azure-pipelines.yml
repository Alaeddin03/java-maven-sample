
trigger:
- azure-pipelines-artifacts

pool:
  name: Default

resources:
  pipelines:
      - pipeline: 1
        source: Alaeddin03.java-maven-sample

steps:           


- script: |
    $(COVERITY_TOOL_HOME)/bin/coverity scan --dir $(IDIR_PATH)/$(IDIR_FILE_NAME)\
        -o commit.connect.url=$CONNECT_URL \
        -o commit.connect.project=azure-sample \
        -o commit.connect.stream=azure-sample-artifact \
        -- mvn clean install
  displayName: Coverity Scan

- publish: $(IDIR_PATH)/$(IDIR_FILE_NAME)
  artifact: azure-sample-artifact


