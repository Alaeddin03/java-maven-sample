
trigger:
- azure-pipelines

pool:
  name: Default

steps:           
- task: DownloadPipelineArtifact@2
  continueOnError: true
  inputs:
    buildType: 'specific'
    project: 'e299d603-e81a-46ba-92bd-f4ed1a9bccc6'
    definition: '1'
    artifactName: 'idir'
    targetPath: '.'

- script: |
    if [ -d "idir" ]; then
      unzip idir.zip -d idir
    else
      echo "Artifact 'idir' not found. Skipping dependent steps."
    fi
  displayName: 'Extract idir if it exists'

- task: synopsys-coverity@1
  inputs:
    coverityService: 'Coverity'
    projectName: 'azure-sample'
    streamName: 'azure-sample'
    coverityBuildDirectory: '$(Build.Repository.LocalPath)'
    buildCommand: 'mvn clean install'
    allowUntrusted: true
  displayName: 'Coverity Scan'

- script: |
    zip -r idir.zip idir
  displayName: 'Compress idir into a zip file'

- task: PublishPipelineArtifact@1
  inputs:
    targetPath: 'idir.zip'            
    artifactName: 'idir'     
    publishLocation: 'pipeline'

