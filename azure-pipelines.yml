
trigger:
- azure-pipelines-artifacts

pool:
  name: Default

resources:
  pipelines:
      - pipeline: 1
        source: Alaeddin03.java-maven-sample

steps:           

- download: 1
  artifact: $(IDIR_FILE_NAME)
  continueOnError: true
  
- task: synopsys-coverity@1
  inputs:
    coverityService: 'Coverity'
    projectName: 'azure-sample'
    streamName: 'azure-sample-artifact'
    coverityBuildDirectory: '$(Build.Repository.LocalPath)'
    buildCommand: 'mvn clean install'
    allowUntrusted: true
  displayName: 'Coverity Scan'

- script: |
    .$(COVERITY_TOOL_HOME)/bin/coverity scan \
        --dir $(IDIR_PATH)/$(IDIR_FILE_NAME)
        -o commit.connect.url=$CONNECT_URL \
        -o commit.connect.project=azure-sample \
        -o commit.connect.stream=azure-sample-artifact
  displayName: Coverit Scan

  

- publish: $(IDIR_PATH)/$(IDIR_FILE_NAME)
  artifact: azure-sample-artifact


