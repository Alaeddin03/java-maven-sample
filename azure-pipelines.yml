
trigger:
- azure-pipelines

pool:
  name: Default

steps:
- task: synopsys-coverity@1
  inputs:
    coverityService: 'Coverity'
    projectName: 'azure-sample'
    streamName: 'azure-sample'
    coverityBuildDirectory: '$(Build.Repository.LocalPath)'
    buildCommand: 'mvn clean install'
    allowUntrusted: true
- task: ArchiveFiles@2
  inputs:
    rootFolderOrFile: 'idir/'
    includeRootFolder: true
    archiveType: 'zip'
    archiveFile: '$(Build.ArtifactStagingDirectory)/$(Build.BuildId)-idir.zip'
    replaceExistingArchive: true

- task: PublishPipelineArtifact@1
  inputs:
    targetPath: '$(Build.ArtifactStagingDirectory)/$(Build.BuildId)-idir.zip'
    artifact: '$(Build.BuildId)-idir'
    publishLocation: 'pipeline'
